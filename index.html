<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box;margin:0;padding:0}html{background:#1a0022}</style>
<title>Alvalm</title>
<meta name="author" content="Issam Akdi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
  /* Layout: une carte centrée sur fond plum, étapes qui se remplacent, bulles de cœurs en arrière-plan */
  :root {
    --bg: #1a0022;
    --bg-2: #4a0033;
    --bg-3: #800040;
    --ink: #fff0f5;
    --ink-soft: #ffd6e6;
    --pink: #ff007f;
    --coral: #ff5e62;
    --yes: #00ff87;
    --yes-ink: #003311;
    --no: #ff4757;
    --card: rgba(255, 255, 255, 0.1);
    --card-line: rgba(255, 182, 193, 0.4);
    --font-display: 'Fredoka', 'Trebuchet MS', Verdana, sans-serif;
    --font-body: 'Nunito', 'Segoe UI', Verdana, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 35%, var(--bg-3) 70%, var(--bg-2) 100%);
    background-size: 250% 250%;
    animation: drift 14s ease-in-out infinite alternate;
    color: var(--ink);
    font-family: var(--font-body);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    text-align: center;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px; min-width: 0;
    background: var(--card);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 2px solid var(--card-line);
    border-radius: 28px;
    padding: 28px 22px 26px;
    box-shadow: 0 0 36px rgba(255, 105, 180, 0.35);
    display: flex; flex-direction: column; gap: 16px;
    animation: rise .5s ease both, floaty 5s ease-in-out .5s infinite;
  }
  .banner {
    animation: glow 1.5s ease-in-out infinite alternate;
    align-self: center;
    background: linear-gradient(90deg, var(--pink), var(--coral));
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 800; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase;
    box-shadow: 0 0 20px rgba(255, 0, 127, 0.7);
  }
  .dots { display: flex; justify-content: center; gap: 8px; }
  .dots span { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 182, 193, 0.3); }
  .dots span.on { background: var(--yes); box-shadow: 0 0 10px var(--yes); }
  .dots span.now { background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  .intro { font-size: 1.05rem; line-height: 1.55; color: var(--ink-soft); text-wrap: pretty; }
  h1 {
    font-family: var(--font-display); font-weight: 600;
    font-size: 1.65rem; line-height: 1.2; text-wrap: balance;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
  }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 4px; }
  button, .link-btn {
    font-family: var(--font-body);
    padding: 13px 28px; font-size: 1.1rem; font-weight: 800;
    border: none; border-radius: 999px; cursor: pointer;
    min-height: 48px;
    transition: transform .15s ease, opacity .2s ease;
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active, .link-btn:active { transform: scale(0.95); }
  button:focus-visible, .link-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .yes { background: var(--yes); color: var(--yes-ink); box-shadow: 0 0 16px rgba(0, 255, 135, 0.6); }
  .no { background: var(--no); color: #fff; box-shadow: 0 0 16px rgba(255, 71, 87, 0.6); }
  .no.used { opacity: 0.45; box-shadow: none; text-decoration: line-through; }
  .next { background: #fff0f5; color: #4a0033; }
  .shake { animation: shake .4s ease; }
  .msg {
    min-height: 3.2em;
    border-radius: 16px; padding: 12px 14px;
    font-weight: 600; line-height: 1.45; font-size: 1rem;
    display: none;
  }
  .msg.show { display: block; animation: rise .3s ease both; }
  .msg.good { background: rgba(0, 255, 135, 0.16); border: 1px solid rgba(0, 255, 135, 0.55); color: #c9ffe3; }
  .msg.bad { background: rgba(255, 71, 87, 0.18); border: 1px solid rgba(255, 71, 87, 0.6); color: #ffd3d7; }
  .final-line { font-size: 1.05rem; line-height: 1.5; color: var(--ink-soft); }
  .mission { background: rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 14px; font-weight: 600; line-height: 1.5; }
  .send { background: linear-gradient(90deg, var(--pink), var(--coral)); color: #fff; box-shadow: 0 0 20px rgba(255, 0, 127, 0.7); }
  .credit { font-size: 0.95rem; color: var(--ink-soft); border-top: 1px solid var(--card-line); padding-top: 14px; letter-spacing: 0.5px; }
  .credit strong { color: #fff; font-weight: 800; }
  #fx { z-index: 5; }
  .fail-title { color: #ffd3d7; }
  .redo { background: var(--no); color: #fff; box-shadow: 0 0 16px rgba(255, 71, 87, 0.6); }
  .again { background: rgba(255, 255, 255, 0.14); color: var(--ink); font-size: 1rem; }
  .restart { background: transparent; color: var(--ink-soft); font-size: .95rem; text-decoration: underline; min-height: 40px; padding: 8px 12px; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes drift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes glow { from { transform: scale(1); box-shadow: 0 0 10px rgba(255, 0, 127, 0.6); } to { transform: scale(1.06); box-shadow: 0 0 26px rgba(255, 0, 127, 1); } }
  .yes, .next { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) {
    body, .card, .banner, .yes, .next, .msg.show, .shake { animation: none; }
  }
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="card" id="card">
  <div class="banner" id="banner">✨ Alvalm ✨</div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <div id="body"></div>
  <p class="credit">Site créé avec ❤️ par <strong>Issam Akdi</strong></p>
</main>

<script>
  var STEPS = [
    {
      banner: '👑 Étape 1 : Le pardon 👑',
      intro: 'Ma princesse, avant de continuer à bouder, tu es obligée de participer à ce petit test. Pas le choix ! 😇 Je suis tellement désolé pour tout. Je sais que j’ai fait une bêtise, mais mon cœur ne bat que pour toi. Je te promets d’être le plus sage des amoureux.',
      q: 'Est-ce que tu pardonnes ton bébé d’amour ? 🥺',
      yes: 'OUI ❤️', no: 'NON ❌',
      yesMsg: 'Bravo ! Tu viens d’illuminer ma journée ! ❤️',
      noMsg: 'Erreur 404 : cette touche est désactivée car ton bébé t’aime trop.'
    },
    {
      banner: '💖 Étape 2 : L’amour pur 💖',
      intro: 'Maintenant que le pardon est accordé, soyons honnêtes deux secondes. Regarde-nous : on est nés pour être ensemble. Tu sais très bien que personne ne t’aimera jamais autant que moi.',
      q: 'Est-ce que tu m’aimes de tout ton cœur ? 🥰',
      yes: 'OUI ❤️', no: 'NON ❌',
      yesMsg: 'Indice : c’est la seule bonne réponse ! 😍',
      noMsg: 'Alerte ! Ton téléphone va auto-détruire cette option.'
    },
    {
      banner: '💍 Étape 3 : L’évidence 💍',
      intro: 'Regarde dans tes yeux et dans les miens. C’est une certitude absolue. Pas besoin de chercher ailleurs, le destin a déjà choisi pour nous.',
      q: 'Est-ce que je suis l’homme de ta vie ? 👑',
      yes: 'OUI ❤️', no: 'NON ❌',
      yesMsg: 'Évidemment ! Tu as débloqué le niveau supérieur ! 🚀',
      noMsg: 'Touche bloquée par le destin.'
    },
    {
      banner: '💒 Étape finale : Le futur 💒',
      intro: 'Prépare déjà ta plus belle tenue, parce que je ne te lâcherai jamais. Mon avenir, c’est toi, et seulement toi.',
      q: 'Est-ce que tu te marieras avec moi un jour ? 🤵👰',
      yes: 'OUI 💍', no: 'NON 🛑',
      yesMsg: 'C’est officiel ! Prépare l’alliance ! 💍',
      noMsg: 'Option indisponible sur ce réseau sentimental.'
    }
  ];
  var step = 0;
  var bodyEl = document.getElementById('body');
  var bannerEl = document.getElementById('banner');
  var dotsEl = document.getElementById('dots');

  function renderDots(done) {
    dotsEl.innerHTML = '';
    for (var i = 0; i < STEPS.length; i++) {
      var d = document.createElement('span');
      if (i < step || done) d.className = 'on';
      else if (i === step) d.className = 'now';
      dotsEl.appendChild(d);
    }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function showStep() {
    var s = STEPS[step];
    bannerEl.textContent = s.banner;
    renderDots(false);
    bodyEl.innerHTML = '';
    var wrap = el('div', '');
    wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '16px';
    wrap.appendChild(el('p', 'intro', s.intro));
    wrap.appendChild(el('h1', '', s.q));
    var msg = el('div', 'msg');
    msg.setAttribute('role', 'status');
    var actions = el('div', 'actions');
    var yes = el('button', 'yes', s.yes);
    var no = el('button', 'no', s.no);
    yes.id = 'btn-yes'; no.id = 'btn-no';
    actions.appendChild(yes); actions.appendChild(no);
    wrap.appendChild(actions);
    wrap.appendChild(msg);
    bodyEl.appendChild(wrap);

    var locked = false;
    no.addEventListener('click', function () {
      if (locked) return;
      locked = true;
      msg.className = 'msg bad show';
      msg.textContent = s.noMsg;
      no.classList.add('shake');
      setTimeout(showFail, 1700);
    });
    yes.addEventListener('click', function () {
      if (locked) return;
      locked = true;
      msg.className = 'msg good show';
      msg.textContent = s.yesMsg;
      burst(window.innerWidth / 2, window.innerHeight * 0.3, 1);
      setTimeout(function () {
        step++;
        if (step < STEPS.length) showStep(); else showFinal();
      }, 1300);
    });
  }

  function showFail() {
    stopFireworks();
    step = 0;
    bannerEl.textContent = '💔 Échec 💔';
    renderDots(false);
    bodyEl.innerHTML = '';
    var wrap = el('div', '');
    wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '16px';
    wrap.appendChild(el('h1', 'fail-title', 'Raté ! Tu as échoué 💔'));
    wrap.appendChild(el('p', 'mission', 'Tu as appuyé sur NON. Retour à la case départ : tu dois tout recommencer à zéro.'));
    var actions = el('div', 'actions');
    var redo = el('button', 'redo', 'Recommencer à zéro 🔄');
    redo.id = 'btn-redo';
    redo.addEventListener('click', function () { step = 0; showStep(); });
    actions.appendChild(redo);
    wrap.appendChild(actions);
    bodyEl.appendChild(wrap);
    redo.focus();
  }

  function showFinal() {
    bannerEl.textContent = '🎉 Alvalm pour la vie 🎉';
    renderDots(true);
    bodyEl.innerHTML = '';
    var wrap = el('div', '');
    wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.gap = '16px';
    wrap.appendChild(el('h1', '', 'Victoire absolue ! ✨ Tu as validé le parcours du pardon !'));
    wrap.appendChild(el('p', 'mission', 'Ta mission : réponds-moi par message avec la touche que tu as choisie pour chaque question. J’attends tes 4 OUI avec impatience 💖'));
    wrap.appendChild(el('p', 'final-line', 'Je t’aime plus que tout au monde, mon cœur. 🥰❤️'));
    var actions = el('div', 'actions');
    var text = 'Mes 4 réponses : OUI ❤️ OUI ❤️ OUI ❤️ OUI 💍 Je te pardonne, mon bébé d’amour 🥰';
    var send = el('a', 'link-btn send', 'Envoyer mes 4 OUI 💌');
    send.id = 'btn-send';
    send.href = 'https://wa.me/?text=' + encodeURIComponent(text);
    send.target = '_blank'; send.rel = 'noopener';
    actions.appendChild(send);
    var fw = el('button', 'again', 'Revoir les feux d’artifice 🎆');
    fw.addEventListener('click', startFireworks);
    actions.appendChild(fw);
    wrap.appendChild(actions);
    var again = el('button', 'restart', 'Recommencer');
    again.addEventListener('click', function () { stopFireworks(); step = 0; showStep(); });
    wrap.appendChild(again);
    bodyEl.appendChild(wrap);
    startFireworks();
  }

  /* Fond animé : cœurs, losanges et cercles néon qui montent */
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var shapes = [];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  function Shape(initial) {
    this.x = Math.random() * canvas.width;
    this.y = initial ? Math.random() * canvas.height : canvas.height + 30;
    this.size = Math.random() * 30 + 12;
    this.speed = Math.random() * 1.8 + 0.7;
    this.opacity = Math.random() * 0.5 + 0.3;
    this.angle = Math.random() * Math.PI * 2;
    this.spin = Math.random() * 0.04 - 0.02;
    this.type = Math.floor(Math.random() * 3);
  }
  Shape.prototype.update = function () {
    this.y -= this.speed; this.angle += this.spin;
    this.x += Math.sin(this.y / 60 + this.size) * 0.7;
    if (this.y < -40) { this.y = canvas.height + 30; this.x = Math.random() * canvas.width; }
  };
  Shape.prototype.draw = function () {
    ctx.save();
    ctx.translate(this.x, this.y); ctx.rotate(this.angle);
    ctx.fillStyle = 'rgba(255,182,193,' + this.opacity + ')';
    if (this.type === 0) {
      var r = this.size / 2;
      ctx.beginPath();
      ctx.arc(-r, 0, r, 0, Math.PI, true);
      ctx.arc(r, 0, r, 0, Math.PI, true);
      ctx.lineTo(0, this.size);
      ctx.closePath(); ctx.fill();
    } else if (this.type === 1) {
      ctx.beginPath();
      ctx.moveTo(0, -this.size);
      ctx.lineTo(this.size / 2, 0);
      ctx.lineTo(0, this.size);
      ctx.lineTo(-this.size / 2, 0);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,0,127,' + this.opacity + ')';
      ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
  };
  for (var i = 0; i < 70; i++) shapes.push(new Shape(true));
  function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var j = 0; j < shapes.length; j++) { if (!reduce) shapes[j].update(); shapes[j].draw(); }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();

  /* Feux d’artifice : calque au-dessus de tout */
  var fx = document.getElementById('fx');
  var fctx = fx.getContext('2d');
  var parts = [], finale = null, fxRunning = false;
  var FX_COLORS = ['#ff007f', '#ff5e62', '#ffb6c1', '#00ff87', '#ffd23f', '#ffffff'];
  function fxResize() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
  window.addEventListener('resize', fxResize);
  fxResize();
  function burst(x, y, power) {
    if (reduce) return;
    var n = Math.round(60 * power);
    var base = FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
    for (var k = 0; k < n; k++) {
      var a = Math.random() * Math.PI * 2;
      var v = (Math.random() * 4 + 2) * (power > 1 ? 1.25 : 1);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1,
        color: Math.random() < 0.7 ? base : FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)]
      });
    }
    runFx();
  }
  function runFx() {
    if (fxRunning) return;
    fxRunning = true;
    requestAnimationFrame(fxFrame);
  }
  function fxFrame() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    for (var k = parts.length - 1; k >= 0; k--) {
      var p = parts[k];
      p.vy += 0.06; p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy; p.life -= 0.012;
      if (p.life <= 0) { parts.splice(k, 1); continue; }
      fctx.globalAlpha = p.life;
      fctx.fillStyle = p.color;
      fctx.beginPath();
      fctx.arc(p.x, p.y, 2.5 * p.life + 0.6, 0, Math.PI * 2);
      fctx.fill();
    }
    fctx.globalAlpha = 1;
    if (parts.length || finale) requestAnimationFrame(fxFrame);
    else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }
  function startFireworks() {
    stopFireworks();
    var count = 0;
    burst(window.innerWidth / 2, window.innerHeight * 0.3, 1.6);
    finale = setInterval(function () {
      burst(window.innerWidth * (0.15 + Math.random() * 0.7), window.innerHeight * (0.12 + Math.random() * 0.5), 1.6);
      count++;
      if (count >= 14) stopFireworks();
    }, 450);
  }
  function stopFireworks() {
    if (finale) { clearInterval(finale); finale = null; }
  }

  /* Chaque touche sur l’écran fait jaillir des étincelles */
  document.addEventListener('pointerdown', function (e) { burst(e.clientX, e.clientY, 0.4); });

  showStep();
</script>

</html>
